[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairness_pipeline_dev_toolkit"
version = "0.5.0"
description = "Measurement Module for the Fairness Pipeline Development Toolkit"
authors = [{ name = "Svrus LLC" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "mlflow>=2.10",
  "statsmodels>=0.14",
  "joblib>=1.3",
  "PyYAML>=6.0",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "-vv -ra --maxfail=1 --disable-warnings"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "black>=24.3",
  "flake8>=7.0",
  "isort>=5.13",
  "pre-commit>=3.6",
  "pip-tools>=7.3",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-python-dateutil",
]
training = [
  "torch>=2.2",
  "matplotlib>=3.8",
  "plotly>=5.22",
]
monitoring = [
  "streamlit>=1.37",
  "dash>=2.16",
  "plotly>=5.22",
  "jinja2>=3.1",
  "PyWavelets>=1.5",
]
adapters = [
  "fairlearn>=0.10",
  "aequitas>=0.42 ; python_version < \"3.12\"",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fairness_pipeline_dev_toolkit*"]   # <-- IMPORTANT
exclude = ["tests*", "benchmarks*"]

[project.scripts]
fairpipe = "fairness_pipeline_dev_toolkit.cli.main:main"

[tool.ruff]
extend-exclude = ["*.ipynb"]
