[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairness-pipeline-dev-toolkit"
version = "0.5.2"
description = "Production-ready toolkit for fairness measurement, mitigation, and monitoring."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Svrus LLC" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "mlflow>=2.10",
  "statsmodels>=0.14",
  "joblib>=1.3",
  "PyYAML>=6.0",
  # Security-critical transitive dependencies pinned to secure versions
  "filelock>=3.20.3",  # CVE-2025-68146, CVE-2026-22701
  "urllib3>=2.6.3",  # CVE-2025-66418, CVE-2025-66471, CVE-2026-21441
  # Medium-priority indirect dependencies with security fixes
  "fonttools>=4.60.2",  # CVE-2025-66034 (indirect via matplotlib/plotly)
  "starlette>=0.49.1",  # CVE-2025-62727 (indirect via monitoring tools)
  "werkzeug>=3.1.5",  # CVE-2025-66221, CVE-2026-21860 (indirect)
  # Note: virtualenv>=20.36.2 (CVE-2026-22702) is a dev tool, not a runtime dependency
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/SvrusIO/fAIr"
Documentation = "https://SvrusIO.github.io/fAIr"
Repository = "https://github.com/SvrusIO/fAIr"
Issues = "https://github.com/SvrusIO/fAIr/issues"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "-vv -ra --maxfail=1 --disable-warnings"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "black==25.9.0",
  "flake8>=7.0",
  "isort>=5.13",
  "pre-commit>=3.6",
  "pip-tools>=7.3",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-python-dateutil",
]
training = [
  "torch>=2.2",
  "matplotlib>=3.8",
  "plotly>=5.22",
]
monitoring = [
  "streamlit>=1.37",
  "dash>=2.16",
  "plotly>=5.22",
  "jinja2>=3.1",
  "PyWavelets>=1.5",
]
adapters = [
  "fairlearn>=0.10",
  "aequitas>=0.42 ; python_version < \"3.12\"",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fairness_pipeline_dev_toolkit*"]   # <-- IMPORTANT
exclude = ["tests*", "benchmarks*"]

[project.scripts]
fairpipe = "fairness_pipeline_dev_toolkit.cli.main:main"

[tool.ruff]
extend-exclude = ["*.ipynb"]
