[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairpipe"
version = "0.11.0"
description = "Production-ready toolkit for fairness measurement, mitigation, and monitoring."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Svrus LLC" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "joblib>=1.3",
  "PyYAML>=6.0",
  # pandas parquet I/O (fairpipe.io.load_data) needs an engine; keep in core
  "pyarrow>=14.0",
  # CVE pins for optional transitive graphs live in the extras that pull them in
  # (filelock→training/torch; fonttools→training|tracking|adapters/matplotlib;
  # urllib3→monitoring|tracking|api/requests). See Wave 4 polish.
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/SvrusIO/fAIr"
Documentation = "https://SvrusIO.github.io/fAIr"
Repository = "https://github.com/SvrusIO/fAIr"
Issues = "https://github.com/SvrusIO/fAIr/issues"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "-vv -ra --maxfail=1 --disable-warnings -m 'not live_llm and not live_bbq'"
pythonpath = ["."]
markers = [
    "live_llm: tests that make real calls to an LLM provider (opt-in, excluded by default)",
    "live_bbq: tests that fetch BBQ JSONL from the pinned upstream commit (opt-in, no LLM call)",
    "calibration: bootstrap coverage / calibration simulations (included in default suite; keep small)",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "black==25.9.0",
  "flake8>=7.0",
  "isort>=5.13",
  "pre-commit>=3.6",
  "pip-tools>=7.3",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-python-dateutil",
  "nbclient>=0.10",
  "nbformat>=5.10",
]
training = [
  "torch>=2.2",
  "matplotlib>=3.8",
  "plotly>=5.22",
  "filelock>=3.20.3",  # CVE-2025-68146, CVE-2026-22701 (via torch)
  "fonttools>=4.60.2",  # CVE-2025-66034 (via matplotlib)
]
monitoring = [
  "streamlit>=1.37",
  "dash>=2.16",
  "plotly>=5.22",
  "jinja2>=3.1",
  "PyWavelets>=1.5",
  "urllib3>=2.6.3",  # CVE-2025-66418/66471, CVE-2026-21441 (via requests)
]
adapters = [
  "fairlearn>=0.10",
  "aequitas>=0.42 ; python_version < \"3.12\"",
  "fonttools>=4.60.2",  # CVE-2025-66034 (via aequitas→matplotlib on py<3.12)
]
api = [
  "fastapi[standard]>=0.111.0",
  "python-multipart>=0.0.9",
  "urllib3>=2.6.3",  # CVE-2025-66418/66471, CVE-2026-21441 (via sentry-sdk / requests)
]
llm = [
  "openai>=1.0",
  "anthropic>=0.25",
  "httpx>=0.27",
]
tracking = [
  "mlflow>=2.10",
  # CVE pins that exist only because of MLflow's transitive graph
  "starlette>=0.49.1",  # CVE-2025-62727 (via mlflow-skinny / fastapi)
  "werkzeug>=3.1.5",  # CVE-2025-66221, CVE-2026-21860 (via Flask)
  "urllib3>=2.6.3",  # CVE-2025-66418/66471, CVE-2026-21441 (via requests/docker)
  "fonttools>=4.60.2",  # CVE-2025-66034 (via matplotlib)
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fairness_pipeline_dev_toolkit*", "fairpipe*"]   # <-- IMPORTANT
exclude = ["tests*", "benchmarks*"]

[tool.setuptools.package-data]
"fairness_pipeline_dev_toolkit" = ["py.typed"]
"fairness_pipeline_dev_toolkit.llm_evals" = ["fixtures/**/*"]
"fairpipe" = ["py.typed"]

[tool.setuptools.exclude-package-data]
"*" = ["*/__pycache__/*", "*.py[co]"]

[project.scripts]
fairpipe = "fairness_pipeline_dev_toolkit.cli.main:main"

[tool.ruff]
extend-exclude = ["*.ipynb"]
