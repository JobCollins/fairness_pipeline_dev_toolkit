name: Security Review

on:
  schedule:
    # Run on the first day of each month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=25.3"
          pip install pip-audit safety bandit
          pip install -e .[dev] -r requirements.txt

      - name: Run comprehensive security scan
        run: |
          echo "## Security Review Report" > security_review.md
          echo "" >> security_review.md
          echo "### Dependency Vulnerability Scan" >> security_review.md
          echo '```' >> security_review.md
          pip-audit --desc >> security_review.md || true
          echo '```' >> security_review.md
          echo "" >> security_review.md

      - name: Run Safety check
        run: |
          echo "### Safety Check" >> security_review.md
          echo '```' >> security_review.md
          safety check --json >> safety_report.json || true
          echo '```' >> security_review.md
          echo "" >> security_review.md

      - name: Run Bandit security linter
        run: |
          echo "### Code Security Analysis (Bandit)" >> security_review.md
          echo '```' >> security_review.md
          bandit -r fairness_pipeline_dev_toolkit -f json -o bandit_report.json || true
          bandit -r fairness_pipeline_dev_toolkit >> security_review.md || true
          echo '```' >> security_review.md
          echo "" >> security_review.md

      - name: Check for open Dependabot PRs
        run: |
          echo "### Dependabot Status" >> security_review.md
          echo "" >> security_review.md
          gh pr list --label "dependencies" --state open --json number,title,createdAt >> dependabot_prs.json || echo "No open Dependabot PRs" >> security_review.md
          echo "" >> security_review.md

      - name: Upload security review report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-review-report
          path: |
            security_review.md
            security_report.json
            bandit_report.json
            dependabot_prs.json
          retention-days: 90

      - name: Create security review issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = 'Monthly security review completed. See artifacts for full report.';
            try {
              report = fs.readFileSync('security_review.md', 'utf8');
            } catch (e) {
              console.log('Could not read security_review.md');
            }
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Monthly Security Review - ${new Date().toISOString().split('T')[0]}`,
              body: report,
              labels: ['security', 'automated']
            });
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
