name: CI
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=25.3"
          pip install -e ".[dev,api,tracking]" -r requirements.txt

      - name: Debug Black version
        run: |
          python -m pip show black || true
          black --version || true

      - name: Lint (black)
        run: black --check fairness_pipeline_dev_toolkit tests

      - name: Lint (flake8)
        run: flake8 fairness_pipeline_dev_toolkit

      - name: Tests with Coverage
        run: |
          pytest --cov=fairness_pipeline_dev_toolkit --cov-report=term-missing --cov-report=xml --cov-report=html
          coverage report --fail-under=85

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/

      # ---------- Fairness Gate (run only on Ubuntu to keep CI fast/stable) ----------
      - name: Prepare tiny synthetic CSV for fairness checks (Ubuntu only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          import numpy as np
          rng = np.random.default_rng(0)
          n = 500
          df = pd.DataFrame({
              "y_true": rng.integers(0, 2, n),
              "y_pred": rng.integers(0, 2, n),
              "group": rng.choice(["A","B"], size=n, p=[0.55, 0.45])
          })
          df.to_csv("ci_sample.csv", index=False)
          PY

      - name: Fairness gate (smoke) — quick script
        if: runner.os == 'Linux'
        run: |
          python scripts/quick_fairness_check.py \
            --csv ci_sample.csv \
            --y-true y_true --y-pred y_pred \
            --sensitive group \
            --threshold 0.12 \
            --min-group-size 20

      - name: Generate Markdown fairness report via CLI (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          python -m fairness_pipeline_dev_toolkit.cli.main validate \
            --csv ci_sample.csv \
            --y-true y_true --y-pred y_pred \
            --sensitive group \
            --min-group-size 20 \
            --out fairness_report.md

      - name: Upload fairness report (artifact) (Ubuntu only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: fairness-report-${{ github.run_id }}-${{ github.job }}-${{ github.job }}
          path: fairness_report.md

      # ---------- Performance Benchmarking (Ubuntu only) ----------
      - name: Run performance benchmarks (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          echo "Running performance benchmarks..."
          python benchmarks/benchmark_metrics_100k.py > benchmark_metrics.txt 2>&1 || true
          python benchmarks/benchmark_pipeline.py > benchmark_pipeline.txt 2>&1 || true
          python benchmarks/benchmark_bootstrap.py > benchmark_bootstrap.txt 2>&1 || true

      - name: Upload benchmark results (Ubuntu only)
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            benchmark_*.txt

  # Non-required: published-artifact smoke (core wheel, no extras).
  # Does not gate merge; tell maintainers if you want it required.
  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade "pip>=25.3" build
          python -m build --wheel

      - name: Install wheel in fresh venv (no extras)
        run: |
          python -m venv /tmp/fairpipe-wheel-smoke
          /tmp/fairpipe-wheel-smoke/bin/python -m pip install --upgrade "pip>=25.3"
          /tmp/fairpipe-wheel-smoke/bin/python -m pip install dist/fairpipe-*.whl

      - name: Core smoke (import, metrics, recorded LLM, no mlflow)
        working-directory: /tmp
        run: |
          /tmp/fairpipe-wheel-smoke/bin/python <<'PY'
          import importlib
          import importlib.util
          import sys

          # MLflow must not ship with a core install.
          assert importlib.util.find_spec("mlflow") is None, "mlflow must not be installed on core"

          import fairpipe
          from fairpipe.metrics import FairnessAnalyzer
          from fairpipe.exceptions import DependencyError

          # Public subpackages that must import on core.
          for name in (
              "fairpipe.metrics",
              "fairpipe.pipeline",
              "fairpipe.stats",
              "fairpipe.integration",
              "fairpipe.llm_evals",
          ):
              importlib.import_module(name)

          import numpy as np
          y_true = np.array([0, 0, 1, 1, 0, 1, 0, 1])
          y_pred = np.array([0, 1, 1, 1, 0, 0, 0, 1])
          sens = np.array(["A", "A", "A", "A", "B", "B", "B", "B"])
          fa = FairnessAnalyzer(backend="native", min_group_size=2)
          dpd = fa.demographic_parity_difference(y_pred, sens, with_ci=False)
          eod = fa.equalized_odds_difference(y_true, y_pred, sens, with_ci=False)
          assert dpd.value == dpd.value  # finite
          assert eod.value == eod.value

          # Tracking entry point must raise a clear install hint.
          from fairpipe.integration import log_fairness_metrics

          try:
              log_fairness_metrics({"demographic_parity_difference": dpd})
          except DependencyError as exc:
              msg = str(exc)
              assert "tracking" in msg.lower() or "fairpipe[tracking]" in msg
          else:
              raise AssertionError("expected DependencyError when mlflow missing")

          # Recorded LLM fixture replay (no live calls; fixtures ship in the wheel).
          from fairpipe.llm_evals import (
              default_recorded_counterfactual_config,
              run_llm_eval,
          )

          cfg = default_recorded_counterfactual_config()
          result = run_llm_eval(cfg)
          assert result is not None
          print("wheel-smoke OK", fairpipe.__version__, "dpd", dpd.value, "eod", eod.value)
          PY

  # Non-required: mypy on the explicit public-API module list (mypy-public.txt).
  mypy-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + mypy
        run: |
          python -m pip install --upgrade "pip>=25.3"
          python -m pip install -e ".[dev]" -r requirements.txt
          # Pin exact mypy so a new release cannot turn this job red on its own.
          python -m pip install "mypy==1.18.2"

      - name: mypy public API
        run: |
          mapfile -t FILES < <(grep -v '^#' mypy-public.txt | grep -v '^$')
          mypy --version
          mypy --follow-imports=silent --ignore-missing-imports --no-incremental "${FILES[@]}"
